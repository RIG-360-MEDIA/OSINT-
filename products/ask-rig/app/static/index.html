<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ask RIG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..700;1,400..600&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  /* ─────────────────────────────────────────────────────────────────────
     AXIOM · "Reading Room"
     Warm-paper light surface (Claude ivory family), one clay accent used
     sparingly, editorial type: Newsreader (serif, wordmark + hero only)
     over Hanken Grotesk (humanist sans, everything else). Dark = warm
     charcoal, not a cold invert — a separate intentional palette.
     ───────────────────────────────────────────────────────────────────── */

  :root[data-theme="light"]{
    color-scheme: light;
    --paper:    #faf9f6;   /* warm white — not clinical #fff */
    --paper-2:  #f1efe8;   /* deeper warm: user bubble, hovers */
    --card:     #ffffff;
    --ink:      #21201c;   /* warm near-black */
    --ink-2:    #6b675e;   /* secondary */
    --ink-3:    #9c988c;   /* faint / meta */
    --line:     #e7e3d8;   /* hairline */
    --line-2:   #efece3;   /* softer hairline */
    --clay:     #be5b36;   /* the one accent */
    --clay-soft:#f3e3d9;   /* accent wash */
    --focus:    rgba(190,91,54,.16);
    --web:      #3a6ea5;
    --web-soft: #e5edf6;
    --shadow:   0 1px 2px rgba(31,30,28,.04), 0 8px 24px -16px rgba(31,30,28,.18);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:    #1e1d1b;   /* warm charcoal — Claude-night, not blue-black */
    --paper-2:  #292824;
    --card:     #242320;
    --ink:      #ece9e1;
    --ink-2:    #a8a49a;
    --ink-3:    #74706a;
    --line:     #36342e;
    --line-2:   #2c2b26;
    --clay:     #d6815c;   /* lifted + desaturated for dark sensitivity */
    --clay-soft:rgba(214,129,92,.15);
    --focus:    rgba(214,129,92,.22);
    --web:      #84b4f0;
    --web-soft: rgba(132,180,240,.14);
    --shadow:   0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.6);
  }

  :root{
    --sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif:"Newsreader", ui-serif, Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --maxw: 46rem;
    --ease: cubic-bezier(.2,.8,.2,1);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.65;
    font-feature-settings:"ss01","cv01";
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    transition:background .3s var(--ease), color .3s var(--ease);
  }
  ::selection{ background:var(--clay-soft); }

  /* ─── Header ─────────────────────────────────────────────────────── */
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:12px;
    padding:13px 22px; border-bottom:1px solid var(--line-2);
    background:color-mix(in oklab, var(--paper) 80%, transparent);
    backdrop-filter:saturate(1.1) blur(8px);
  }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
  .mono-mark{
    width:27px; height:27px; border-radius:7px; display:grid; place-items:center;
    background:var(--clay); color:#fff; font-family:var(--serif);
    font-weight:600; font-size:16px; line-height:1; letter-spacing:0;
  }
  .wordmark{ font-family:var(--serif); font-weight:500; font-size:18px; letter-spacing:-.01em; }
  .header-right{ margin-left:auto; display:flex; align-items:center; gap:6px; }
  .corpus{ color:var(--ink-3); font-size:12.5px; margin-right:6px; white-space:nowrap; }
  .iconbtn{
    background:none; border:none; color:var(--ink-2); width:34px; height:34px;
    border-radius:8px; cursor:pointer; display:grid; place-items:center;
    transition:background .15s var(--ease), color .15s var(--ease);
  }
  .iconbtn:hover{ background:var(--paper-2); color:var(--ink); }
  .iconbtn svg{ width:18px; height:18px; }

  /* labelled "New chat" button — clear affordance like GPT/Claude */
  .newchat-btn{
    display:inline-flex; align-items:center; gap:7px; background:none;
    border:1px solid var(--line); color:var(--ink-2);
    font-family:var(--sans); font-size:13px; font-weight:550; line-height:1;
    padding:8px 13px; border-radius:9px; cursor:pointer; white-space:nowrap;
    transition:border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  .newchat-btn:hover{ border-color:var(--clay); color:var(--ink); background:var(--paper-2); }
  .newchat-btn svg{ width:16px; height:16px; }
  @media (max-width:640px){ .newchat-btn span{ display:none; } .newchat-btn{ padding:8px; } }

  /* ─── Scroll area ────────────────────────────────────────────────── */
  main{ flex:1 1 auto; overflow-y:auto; scroll-behavior:smooth; }
  main::-webkit-scrollbar{ width:11px; }
  main::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; border:3px solid var(--paper); }
  main::-webkit-scrollbar-thumb:hover{ background:var(--ink-3); }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:30px 22px 160px; }

  /* ─── Hero (empty state) ─────────────────────────────────────────── */
  .hero{
    min-height:62vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; gap:28px; animation:fade .5s var(--ease);
  }
  .hero h1{
    font-family:var(--serif); font-weight:500; font-size:clamp(28px,5vw,40px);
    margin:0; letter-spacing:-.015em; line-height:1.1;
  }
  .hero p{ color:var(--ink-2); margin:-12px 0 0; font-size:15px; max-width:46ch; line-height:1.6; }
  .chips{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:11px; max-width:560px; width:100%; }
  .chip{
    background:var(--card); border:1px solid var(--line); border-radius:13px;
    padding:13px 16px; cursor:pointer; text-align:left; color:var(--ink);
    transition:border-color .16s var(--ease), background .16s var(--ease), transform .16s var(--ease);
  }
  .chip:hover{ border-color:var(--clay); background:var(--paper-2); transform:translateY(-1px); }
  .chip b{ font-weight:550; font-size:14px; display:block; }
  .chip span{ color:var(--ink-3); font-size:12.5px; }

  /* ─── Messages ───────────────────────────────────────────────────── */
  .msg{ animation:rise .4s var(--ease) both; margin:34px 0; }
  .msg.user{ display:flex; justify-content:flex-end; }
  .msg.user .bubble{
    background:var(--paper-2); color:var(--ink); padding:11px 17px;
    border-radius:18px; max-width:80%; white-space:pre-wrap; line-height:1.55;
  }
  .msg.bot{ display:flex; gap:14px; align-items:flex-start; }
  .avatar{
    flex:0 0 auto; width:28px; height:28px; border-radius:8px; margin-top:1px;
    display:grid; place-items:center; background:var(--card); border:1px solid var(--line);
    font-family:var(--serif); font-weight:600; font-size:14px; color:var(--clay);
  }
  .turn{ min-width:0; flex:1; }

  /* status line while working */
  .status{ display:flex; align-items:center; min-height:27px; font-size:14.5px; }
  .thinking{
    background:linear-gradient(90deg,var(--ink-3) 32%,var(--ink) 50%,var(--ink-3) 68%);
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text;
    color:transparent; animation:shimmer 1.7s linear infinite;
  }

  /* answer body (markdown) */
  .answer{ font-size:16px; line-height:1.72; }
  .answer > :first-child{ margin-top:0; }
  .answer h2,.answer h3{ font-weight:600; letter-spacing:-.01em; line-height:1.3; color:var(--ink); }
  .answer h2{ font-size:18.5px; margin:26px 0 10px; }
  .answer h3{ font-size:15.5px; margin:20px 0 8px; }
  .answer p{ margin:0 0 14px; }
  .answer ul,.answer ol{ margin:6px 0 16px; padding-left:24px; }
  .answer li{ margin:6px 0; line-height:1.62; }
  .answer li::marker{ color:var(--ink-3); }
  .answer strong{ color:var(--ink); font-weight:650; }
  .answer em{ color:var(--ink-2); }
  .answer a{ color:var(--clay); text-decoration:underline; text-decoration-color:var(--clay-soft);
    text-underline-offset:2px; transition:text-decoration-color .14s; }
  .answer a:hover{ text-decoration-color:var(--clay); }
  .answer code{ background:var(--paper-2); border:1px solid var(--line-2); padding:.08em .42em;
    border-radius:5px; font-family:var(--mono); font-size:.86em; }
  .answer table{ border-collapse:collapse; margin:18px 0; width:100%; font-size:14.5px; }
  .answer th,.answer td{ border:1px solid var(--line); padding:9px 12px; text-align:left; }
  .answer th{ background:var(--paper-2); font-weight:600; }
  .answer blockquote{ border-left:2px solid var(--clay); margin:16px 0; padding:2px 16px; color:var(--ink-2); }
  .answer .cursor{ display:inline-block; width:2px; height:1.05em; background:var(--clay);
    margin-left:2px; vertical-align:-2px; border-radius:1px; animation:caret 1.1s ease-in-out infinite; }

  /* inline citation — quiet numbered superscript */
  .cite{
    display:inline-block; font-size:.7em; font-weight:650; line-height:1; color:var(--clay);
    background:var(--clay-soft); border-radius:5px; padding:.22em .42em; margin:0 .12em;
    vertical-align:.38em; cursor:pointer; text-decoration:none; letter-spacing:.01em;
    transition:background .14s var(--ease), color .14s var(--ease);
  }
  .cite:hover{ background:var(--clay); color:#fff; }

  /* ─── Sources ────────────────────────────────────────────────────── */
  details.sources{ margin-top:26px; border-top:1px solid var(--line-2); padding-top:16px; }
  details.sources summary{
    cursor:pointer; list-style:none; color:var(--ink-2); font-size:13.5px; font-weight:500;
    display:flex; align-items:center; gap:8px; user-select:none; width:fit-content;
    transition:color .14s;
  }
  details.sources summary::-webkit-details-marker{ display:none; }
  details.sources summary:hover{ color:var(--ink); }
  details.sources summary .car{ transition:transform .2s var(--ease); font-size:9px; color:var(--ink-3); }
  details.sources[open] summary .car{ transform:rotate(90deg); }
  .srclist{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .src{
    display:flex; gap:12px; align-items:flex-start; padding:11px 13px; background:var(--card);
    border:1px solid var(--line-2); border-radius:11px;
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .src.hot{ border-color:var(--clay); box-shadow:0 0 0 3px var(--focus); }
  .src .n{ font-size:11px; font-weight:650; color:var(--clay); flex:0 0 auto; margin-top:2px;
    min-width:24px; }
  .src .body{ min-width:0; flex:1; }
  .src .t{ font-size:14px; color:var(--ink); text-decoration:none; display:block; line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; }
  .src .t:hover{ color:var(--clay); }
  .src .meta{ font-size:11.5px; color:var(--ink-3); margin-top:4px; display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
  .badge{ font-size:10px; font-weight:600; padding:2px 7px; border-radius:5px; letter-spacing:.01em; }
  .badge.web{ color:var(--web); background:var(--web-soft); }
  .badge.corpus{ color:var(--clay); background:var(--clay-soft); }

  /* ─── Answer actions (copy / retry) — quiet, reveal on hover ──────── */
  .actions{ display:flex; gap:2px; margin-top:16px; margin-left:-9px;
    opacity:0; transform:translateY(2px); transition:opacity .2s var(--ease), transform .2s var(--ease); }
  .msg.bot:hover .actions, .actions:focus-within{ opacity:1; transform:none; }
  .act{ display:inline-flex; align-items:center; gap:6px; background:none; border:1px solid transparent;
    color:var(--ink-3); font-family:var(--sans); font-size:12.5px; line-height:1; padding:6px 10px;
    border-radius:8px; cursor:pointer; transition:background .14s var(--ease), color .14s var(--ease); }
  .act:hover{ background:var(--paper-2); color:var(--ink); }
  .act svg{ width:14px; height:14px; }
  .act.ok{ color:var(--clay); }
  @media (hover:none){ .actions{ opacity:1; transform:none; } }  /* touch: always visible */

  /* ─── Enumerate list (cards) ─────────────────────────────────────── */
  .listhdr{ font-size:15px; color:var(--ink); margin:0 0 14px; line-height:1.5; }
  .listhdr b{ font-weight:650; }
  .listnote{ font-size:13px; color:var(--ink-3); margin-top:4px; }
  .lcards{ display:flex; flex-direction:column; gap:9px; }
  .lcard{ display:flex; gap:12px; padding:13px 15px; background:var(--card);
    border:1px solid var(--line-2); border-radius:12px;
    transition:border-color .15s var(--ease), box-shadow .15s var(--ease); }
  .lcard:hover{ border-color:var(--line); box-shadow:var(--shadow); }
  .lcard-n{ flex:0 0 auto; font-size:12px; font-weight:650; color:var(--ink-3);
    min-width:20px; text-align:right; margin-top:2px; }
  .lcard-body{ min-width:0; flex:1; }
  .lcard-title{ font-size:14.5px; line-height:1.4; }
  .lcard-title a{ color:var(--ink); text-decoration:none; }
  .lcard-title a:hover{ color:var(--clay); text-decoration:underline; text-underline-offset:2px; }
  .lcard-meta{ display:flex; flex-wrap:wrap; gap:8px; margin-top:5px; font-size:11.5px; color:var(--ink-3); }
  .lcard-meta span{ white-space:nowrap; }
  .lcard-snip{ font-size:13px; color:var(--ink-2); margin-top:7px; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .explain-btn{ margin-top:9px; background:none; border:1px solid var(--line);
    color:var(--ink-2); font-family:var(--sans); font-size:12px; font-weight:550;
    padding:5px 11px; border-radius:7px; cursor:pointer;
    transition:border-color .14s var(--ease), color .14s var(--ease), background .14s var(--ease); }
  .explain-btn:hover{ border-color:var(--clay); color:var(--clay); background:var(--clay-soft); }

  /* ─── Charts (Chart.js) ──────────────────────────────────────────── */
  .chart-title{ font-size:14.5px; font-weight:600; color:var(--ink); margin:2px 0 10px; }
  .chart-wrap{ position:relative; height:300px; width:100%;
    background:var(--card); border:1px solid var(--line-2); border-radius:12px; padding:12px; }
  .chart-note{ font-size:12px; color:var(--ink-3); margin-top:8px; line-height:1.45; }
  .answer > p + .chart-title{ margin-top:14px; }

  /* ─── Composer ───────────────────────────────────────────────────── */
  .composer-wrap{
    position:fixed; bottom:0; left:0; right:0; padding:16px 22px 22px;
    background:linear-gradient(180deg,transparent,var(--paper) 42%);
  }
  .composer{
    max-width:var(--maxw); margin:0 auto; display:flex; align-items:flex-end; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:24px;
    padding:9px 9px 9px 19px; box-shadow:var(--shadow);
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .composer:focus-within{ border-color:var(--clay); box-shadow:0 0 0 4px var(--focus); }
  .composer textarea{
    flex:1; background:none; border:none; color:var(--ink); resize:none;
    font-family:var(--sans); font-size:16px; line-height:1.5; max-height:208px; padding:8px 0;
    outline:none;
  }
  .composer textarea::placeholder{ color:var(--ink-3); }
  .send{
    flex:0 0 auto; width:35px; height:35px; border-radius:50%; border:none; cursor:pointer;
    background:var(--ink); color:var(--paper); display:grid; place-items:center;
    transition:opacity .15s var(--ease), background .15s var(--ease);
  }
  .send svg{ width:18px; height:18px; }
  .send:hover{ opacity:.85; }
  .send:disabled{ background:var(--line); color:var(--ink-3); cursor:default; opacity:1; }
  .foot{ max-width:var(--maxw); margin:10px auto 0; text-align:center; color:var(--ink-3); font-size:11.5px; }

  /* ─── Motion ─────────────────────────────────────────────────────── */
  @keyframes shimmer{ to{ background-position:-220% 0; } }
  @keyframes caret{ 0%,100%{ opacity:1; } 50%{ opacity:.2; } }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important;
       transition-duration:.001ms !important; scroll-behavior:auto !important; }
    .thinking{ color:var(--ink-2); }
    .answer .cursor{ opacity:.6; }
  }

  @media (max-width:640px){
    .wrap{ padding:20px 16px 150px; }
    .chips{ grid-template-columns:1fr; }
    .corpus{ display:none; }
    header{ padding:12px 16px; }
    .composer-wrap{ padding:12px 16px 18px; }
  }

  :focus-visible{ outline:2px solid var(--clay); outline-offset:2px; border-radius:4px; }
</style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Ask RIG — home">
      <span class="mono-mark">R</span>
      <span class="wordmark">Ask RIG</span>
    </a>
    <div class="header-right">
      <span class="corpus" id="corpusPill">354K sources · 4 languages</span>
      <button class="iconbtn" id="themeToggle" aria-label="Toggle light and dark theme"></button>
      <button class="newchat-btn" id="newchat" aria-label="New chat" title="Start a new chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="wrap" id="wrap">
      <div class="hero" id="hero">
        <h1>What are you tracking today?</h1>
        <p>Ask anything. I search the live news corpus, the open web, and entity
           coverage — then write a grounded, cited answer.</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask anything about the news…"></textarea>
      <button class="send" id="send" aria-label="Send" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="foot">Every answer is grounded in retrieved sources — responses can be incomplete, so verify via Sources.</div>
  </div>

<script>
const $ = id => document.getElementById(id);
const root = document.documentElement;
const main = $("main"), wrap = $("wrap"), hero = $("hero"), input = $("input"), send = $("send");
let history = [];        // [{role, content}] for follow-ups (LLM contract)
let transcript = [];     // [{role:'user',content} | {role:'bot',answer,sources}] for persistence/replay
let lastListItems = [];  // items from the most recent enumerate list (for "explain #N")
let streaming = false;
let abortCtl = null;

/* ── icons ── */
const SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>';
const ARROW= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>';
const COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>';
const CHECK= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const REGEN= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';
const DLOAD= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>';
const LS_KEY = "askrig-transcript";

/* ── theme: stored pref, else system ── */
const themeToggle = $("themeToggle");
function applyTheme(t){ root.setAttribute("data-theme", t); themeToggle.innerHTML = (t==="dark") ? SUN : MOON; }
applyTheme(localStorage.getItem("askrig-theme")
  || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

/* ── example chips ── */

  ["Latest in Telangana", "what's developing across the state today"],
  ["Who is Revanth Reddy", "profile from recent coverage"],
  ["India–US trade talks", "where things stand now"],
  ["Hyderabad metro expansion", "context + what's next"],
];

  $("chips").innerHTML = EXAMPLES.map(([t,s],i)=>
    `<div class="chip" data-i="${i}"><b>${t}</b><span>${s}</span></div>`).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ input.value=EXAMPLES[c.dataset.i][0]; ask(); });

renderChips();

/* ── live corpus count for the header pill (replaces the static placeholder) ── */
async function loadStats(){
  try{
    const r = await fetch("/stats"); if(!r.ok) return;
    const d = await r.json();
    if(typeof d.surfaceable === "number"){
      $("corpusPill").textContent = d.surfaceable.toLocaleString() + " sources · " + (d.languages||4) + " languages";
    }
  }catch{ /* leave the existing label on any failure */ }
}
loadStats();
setInterval(loadStats, 300000);   // refresh every 5 min (matches server-side cache TTL)

input.addEventListener("input", ()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,208)+"px"; });
input.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); ask(); }});
send.onclick = ()=> streaming ? stop() : ask();

  history=[]; transcript=[]; try{ localStorage.removeItem(LS_KEY); }catch{}

/* ── tiny markdown renderer (headers, bold, italic, lists, tables, code, [S#]) ── */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s = s.replace(/\[S(\d+)\]/g,'<span class="cite" data-s="$1">S$1</span>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function renderMD(text){
  const lines = text.split("\n");
  let html="", i=0;
  const flushList = (tag,items)=> `<${tag}>${items.map(x=>`<li>${inline(x)}</li>`).join("")}</${tag}>`;
  while(i<lines.length){
    let ln = lines[i];
    if(/^\s*$/.test(ln)){ i++; continue; }
    // table
    if(/^\s*\|.*\|\s*$/.test(ln) && i+1<lines.length && /^\s*\|[-:\s|]+\|\s*$/.test(lines[i+1])){
      const head = ln.trim().replace(/^\||\|$/g,"").split("|").map(s=>s.trim());
      i+=2; const rows=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        rows.push(lines[i].trim().replace(/^\||\|$/g,"").split("|").map(s=>s.trim())); i++;
      }
      html += `<table><thead><tr>${head.map(h=>`<th>${inline(h)}</th>`).join("")}</tr></thead>`
            + `<tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      continue;
    }
    let m;
    if((m=ln.match(/^(#{2,3})\s+(.*)/))){ const t=m[1].length===2?"h2":"h3"; html+=`<${t}>${inline(m[2])}</${t}>`; i++; continue; }
    if(/^>\s?/.test(ln)){ html+=`<blockquote>${inline(ln.replace(/^>\s?/,""))}</blockquote>`; i++; continue; }
    if(/^\s*[-*]\s+/.test(ln)){ const items=[]; while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*]\s+/,"")); i++; } html+=flushList("ul",items); continue; }
    if(/^\s*\d+\.\s+/.test(ln)){ const items=[]; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*\d+\.\s+/,"")); i++; } html+=flushList("ol",items); continue; }
    // paragraph (gather until blank)
    const para=[ln]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{2,3}\s|>\s?|\s*[-*]\s|\s*\d+\.\s|\s*\|)/.test(lines[i])){ para.push(lines[i]); i++; }
    html+=`<p>${inline(para.join(" "))}</p>`;
  }
  return html;
}

function scrollDown(){ main.scrollTop = main.scrollHeight; }

function addUser(text){
  const el=document.createElement("div"); el.className="msg user";
  el.innerHTML=`<div class="bubble">${esc(text)}</div>`; wrap.appendChild(el); scrollDown();
}

function addBot(){
  const el=document.createElement("div"); el.className="msg bot";
  el.innerHTML = `<div class="avatar" aria-hidden="true">R</div>
    <div class="turn">
      <div class="status" data-status><span class="thinking" data-stxt>Reading your question</span></div>
      <div class="answer" data-answer style="display:none"></div>
      <div data-srcwrap></div>
    </div>`;
  wrap.appendChild(el); scrollDown(); return el;
}

function setStatus(el, text){ const s=el.querySelector("[data-stxt]"); if(s) s.textContent=text; }

function renderSources(el, sources){
  if(!sources || !sources.length) return;
  const list = sources.map(s=>{
    const date = s.published_at ? s.published_at.slice(0,10) : "";
    const lang = (s.language||"").toUpperCase();
    const t = s.url ? `<a class="t" href="${s.url}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`
                    : `<span class="t">${esc(s.title||"Untitled")}</span>`;
    return `<div class="src" data-src="${s.marker}">
      <span class="n">${s.marker}</span>
      <div class="body">${t}
        <div class="meta"><span class="badge ${s.kind}">${s.kind}</span>
          ${lang?`<span>${lang}</span>`:""}${date?`<span>${date}</span>`:""}</div>
      </div></div>`;
  }).join("");
  el.querySelector("[data-srcwrap]").innerHTML =
    `<details class="sources"><summary><span class="car">▶</span> Sources (${sources.length})</summary>
       <div class="srclist">${list}</div></details>`;
}

/* clicking a [S#] pill opens + highlights its source */
wrap.addEventListener("click", e=>{
  const pill = e.target.closest(".cite"); if(!pill) return;
  const msg = pill.closest(".msg");
  const det = msg.querySelector("details.sources"); if(det) det.open=true;
  const src = msg.querySelector(`[data-src="S${pill.dataset.s}"]`);
  if(src){ src.classList.add("hot"); src.scrollIntoView({behavior:"smooth",block:"center"});
    setTimeout(()=>src.classList.remove("hot"),1800); }
});

/* ── enumerate list rendering ── */
function fmtWhen(h){
  const m={1:"last hour",24:"last 24h",48:"last 48h",168:"last 7 days",720:"last 30 days"};
  return h ? " · "+(m[h]||("last "+h+"h")) : "";
}
function renderList(ev){
  const f = ev.filters||{};
  const subj = ev.subject ? esc(ev.subject) : null;
  let head;
  if(f.recent){
    head = `🕒 <b>Most recent</b> article${ev.shown===1?"":"s"}${subj?` on <b>${subj}</b>`:""}${fmtWhen(f.since_hours)}, newest first`;
  } else {
    head = `Found <b>${(ev.total||0).toLocaleString()}</b> article${ev.total===1?"":"s"} on <b>${subj||"the corpus"}</b>${fmtWhen(f.since_hours)}`;
  }
  if(f.languages) head += " · "+f.languages.join("/").toUpperCase();
  let note="";
  if(f.sentiment && f.sentiment_applied)
    note = `Showing the <b>${ev.shown}</b> classified <b>${f.sentiment}</b> among the latest ${ev.scanned}.`;
  else if(f.sentiment && !f.sentiment_applied)
    note = `Couldn't auto-classify tone — showing the latest ${ev.shown}.`;
  else if(ev.shown < ev.total)
    note = `Showing the latest <b>${ev.shown}</b>.`;
  if(!ev.items.length) note = "No matching articles.";
  const cards = ev.items.map((it,i)=>{
    const date = it.published_at ? it.published_at.slice(0,16).replace("T"," ") : "";
    const lang = (it.language||"").toUpperCase();
    const ttl = it.url ? `<a href="${it.url}" target="_blank" rel="noopener">${esc(it.title)}</a>` : esc(it.title);
    return `<div class="lcard"><div class="lcard-n">${i+1}</div><div class="lcard-body">
      <div class="lcard-title">${ttl}</div>
      <div class="lcard-meta">${lang?`<span>${lang}</span>`:""}${date?`<span>${date}</span>`:""}</div>
      ${it.snippet?`<div class="lcard-snip">${esc(it.snippet)}</div>`:""}
      <button class="explain-btn" data-id="${it.id}" data-title="${esc(it.title)}">Explain</button>
    </div></div>`;
  }).join("");
  return `<div class="listhdr">${head}${note?`<div class="listnote">${note}</div>`:""}</div><div class="lcards">${cards}</div>`;
}
/* clicking Explain on a card asks for a detailed write-up of that article */
wrap.addEventListener("click", e=>{
  const btn = e.target.closest(".explain-btn"); if(!btn || streaming) return;
  ask(`Explain this article: "${btn.dataset.title}"`, {article_id: btn.dataset.id});
});

/* ── chart rendering (Chart.js, themed to the palette) ── */
function renderChartInto(el, ev){
  el.innerHTML =
    (ev.caption ? `<p>${inline(ev.caption)}</p>` : "") +
    (ev.title ? `<div class="chart-title">${esc(ev.title)}</div>` : "") +
    `<div class="chart-wrap"><canvas></canvas></div>` +
    (ev.note ? `<div class="chart-note">${esc(ev.note)}</div>` : "");
  const cv = el.querySelector("canvas");
  if(typeof Chart === "undefined"){ cv.parentElement.innerHTML = "<em>chart library still loading — refresh</em>"; return; }
  drawChart(cv, ev);
}
function drawChart(canvas, ev){
  const cs = getComputedStyle(document.documentElement);
  const v = (n,f)=> (cs.getPropertyValue(n).trim() || f);
  const ink = v("--ink-2","#6b675e"), grid = v("--line","#e7e3d8"), paper = v("--card","#ffffff");
  const named = { negative:v("--clay","#be5b36"), neutral:"#9c988c", positive:"#3a8f63", articles:v("--clay","#be5b36") };
  const cycle = [v("--clay","#be5b36"), "#3a6ea5", "#3a8f63", "#9c988c", "#c99a4e", "#7a6fae", "#4aa3a3", "#b5683f"];
  const kind = ev.kind || "bar";
  const pieish = (kind === "pie" || kind === "doughnut");
  const line = kind === "line";
  const ds = (ev.series||[]).map((s,i)=>{
    const col = named[s.label] || cycle[i % cycle.length];
    if(pieish) return { label:s.label, data:s.data, backgroundColor: s.data.map((_,j)=>cycle[j%cycle.length]), borderColor:paper, borderWidth:2 };
    return { label:s.label, data:s.data, backgroundColor: line ? "transparent" : col, borderColor: col,
      borderWidth:2, tension:.3, fill:false, pointRadius:3, pointBackgroundColor:col, borderRadius:4 };
  });
  const opts = {
    responsive:true, maintainAspectRatio:false, animation:{duration:400},
    plugins:{ legend:{ display: pieish || (ev.series||[]).length>1, position: pieish?"right":"top",
      labels:{ color:ink, boxWidth:12, font:{size:11} } } },
  };
  if(!pieish) opts.scales = {
    x:{ stacked:!!ev.stacked, ticks:{ color:ink, font:{size:11} }, grid:{ color:grid } },
    y:{ stacked:!!ev.stacked, beginAtZero:true, ticks:{ color:ink, font:{size:11}, precision:0 }, grid:{ color:grid } },
  };
  new Chart(canvas, { type:kind, data:{ labels:ev.labels||[], datasets:ds }, options:opts });
}

function setBusy(b){
  streaming=b; send.innerHTML = b ? STOP : ARROW;
  send.disabled = !b && !input.value.trim();
}

/* ── persistence: transcript ⇄ localStorage (survives refresh) ── */
function saveTranscript(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(transcript)); }
  catch{ try{ localStorage.setItem(LS_KEY, JSON.stringify(transcript.slice(-30))); }catch{} }
}

/* ── per-answer actions: copy + regenerate ── */
function addActions(botEl, q, raw){
  const turn = botEl.querySelector(".turn");
  if(turn.querySelector(".actions")) return;          // idempotent
  const bar = document.createElement("div"); bar.className="actions";
  bar.innerHTML =
    `<button class="act" data-a="copy" title="Copy answer">${COPY}<span>Copy</span></button>
     <button class="act" data-a="dl" title="Download as Markdown">${DLOAD}<span>Export</span></button>
     <button class="act" data-a="regen" title="Regenerate this answer">${REGEN}<span>Retry</span></button>`;
  bar.querySelector('[data-a="copy"]').onclick = ()=> copyAnswer(bar, raw);
  bar.querySelector('[data-a="dl"]').onclick = ()=> downloadAnswer(raw);
  bar.querySelector('[data-a="regen"]').onclick = ()=> regen(botEl);
  turn.appendChild(bar);
}
function downloadAnswer(raw){
  const blob = new Blob([raw], {type:"text/markdown;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "rig-export-" + new Date().toISOString().slice(0,10) + ".md";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function copyAnswer(bar, raw){
  const btn = bar.querySelector('[data-a="copy"]'), span = btn.querySelector("span");
  navigator.clipboard.writeText(raw).then(()=>{
    btn.classList.add("ok"); btn.querySelector("svg").outerHTML = CHECK; span.textContent="Copied";
    setTimeout(()=>{ btn.classList.remove("ok"); const s=btn.querySelector("svg"); if(s) s.outerHTML=COPY; span.textContent="Copy"; }, 1500);
  }).catch(()=>{ span.textContent="Press ⌘C"; });
}
/* 0-based position of this bot turn among bot messages in the DOM */
function exchangeIndex(botEl){
  let n=0, node=wrap.firstElementChild;
  while(node){ if(node.classList && node.classList.contains("bot")){ if(node===botEl) return n; n++; } node=node.nextElementSibling; }
  return n;
}
function regen(botEl){
  if(streaming) return;
  const userEl = botEl.previousElementSibling;
  const q = (userEl && userEl.classList.contains("user")) ? userEl.querySelector(".bubble").textContent : null;
  if(!q) return;
  const E = exchangeIndex(botEl);                      // keep E complete exchanges before this one
  transcript = transcript.slice(0, 2*E);
  history    = history.slice(0, 2*E);
  saveTranscript();
  let cur = (userEl && userEl.classList.contains("user")) ? userEl : botEl;
  while(cur){ const nxt=cur.nextElementSibling; cur.remove(); cur=nxt; }
  ask(q);
}

/* ── rebuild a finished bot turn (used when replaying saved history) ── */
function replayBot(q, raw, sources, listHtml, chart){
  const el=document.createElement("div"); el.className="msg bot";
  el.innerHTML = `<div class="avatar" aria-hidden="true">R</div>
    <div class="turn"><div class="answer" data-answer></div><div data-srcwrap></div></div>`;
  wrap.appendChild(el);
  const ans = el.querySelector("[data-answer]");
  if(chart){ renderChartInto(ans, chart); return; }       // chart result
  if(listHtml){ ans.innerHTML = listHtml; return; }        // enumerate result
  ans.innerHTML = renderMD(raw);
  if(sources) renderSources(el, sources);
  addActions(el, q, raw);
}
function restore(){
  let saved=null; try{ saved=JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch{}
  if(!Array.isArray(saved) || !saved.length) return;
  transcript = saved; history = [];
  hero.style.display="none";
  for(let k=0;k<transcript.length;k++){
    const t=transcript[k];
    if(t.role==="user"){ addUser(t.content); history.push({role:"user",content:t.content}); }
    else {
      replayBot(transcript[k-1] && transcript[k-1].content || "", t.answer, t.sources, t.listHtml, t.chart);
      history.push({role:"assistant",content:t.answer || (t.chart ? "(returned a chart)" : "(returned a list of matching articles)")});
    }
  }
  scrollDown();
}

async function ask(preset, opts){
  opts = opts || {};
  const q = (preset!==undefined ? preset : input.value).trim(); if(!q || streaming) return;
  // typed "explain #5" → resolve to the 5th item of the last list, if any
  let articleId = opts.article_id || null;
  if(!articleId){
    const m = q.match(/^(?:explain|open|expand|tell me about)\s+#?(\d+)\b/i);
    if(m && lastListItems[+m[1]-1]) articleId = lastListItems[+m[1]-1].id;
  }
  hero.style.display="none";
  if(preset===undefined){ input.value=""; input.style.height="auto"; }
  addUser(q);
  const bot = addBot();
  const ansEl = bot.querySelector("[data-answer]");
  const statusEl = bot.querySelector("[data-status]");
  setBusy(true);

  let raw=""; let gotToken=false; let turnSources=null; let isList=false; let listHtml=""; let isChart=false; let chartSpec=null;
  abortCtl = new AbortController();
  try{
    const resp = await fetch("/chat",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ query:q, history, article_id:articleId }), signal:abortCtl.signal
    });
    if(!resp.ok || !resp.body) throw new Error("HTTP "+resp.status);
    const reader = resp.body.getReader(); const dec=new TextDecoder();
    let buf="";
    const draw = ()=>{ ansEl.innerHTML = renderMD(raw) + '<span class="cursor"></span>'; };
    while(true){
      const {value,done} = await reader.read(); if(done) break;
      buf += dec.decode(value,{stream:true});
      let nl;
      while((nl = buf.indexOf("\n\n")) >= 0){
        const frame = buf.slice(0,nl); buf = buf.slice(nl+2);
        const line = frame.split("\n").find(l=>l.startsWith("data:")); if(!line) continue;
        let ev; try{ ev = JSON.parse(line.slice(5).trim()); }catch{ continue; }
        if(ev.type==="status"){ if(!gotToken) setStatus(bot,ev.text); }
        else if(ev.type==="sources"){ turnSources=ev.sources; renderSources(bot, ev.sources); }
        else if(ev.type==="token"){
          if(!gotToken){ gotToken=true; statusEl.remove(); ansEl.style.display="block"; }
          raw += ev.text; draw(); scrollDown();
        }
        else if(ev.type==="list"){
          gotToken=true; if(statusEl) statusEl.remove(); ansEl.style.display="block";
          isList=true; lastListItems=ev.items||[]; listHtml=renderList(ev); ansEl.innerHTML=listHtml; scrollDown();
        }
        else if(ev.type==="chart"){
          gotToken=true; if(statusEl) statusEl.remove(); ansEl.style.display="block";
          isChart=true; chartSpec=ev; renderChartInto(ansEl, ev); scrollDown();
        }
        else if(ev.type==="error"){
          if(!gotToken){ statusEl.remove(); ansEl.style.display="block"; }
          raw += (raw?"\n\n":"")+"⚠️ "+ev.text; draw();
        }
        else if(ev.type==="done"){ /* finalize below */ }
      }
    }
    if(isChart){
      transcript.push({role:"user",content:q});
      transcript.push({role:"bot",chart:chartSpec});
      history.push({role:"user",content:q});
      history.push({role:"assistant",content:"(returned a chart)"});
      saveTranscript();
    } else if(isList){
      ansEl.innerHTML = listHtml;                          // keep the list, not markdown
      transcript.push({role:"user",content:q});
      transcript.push({role:"bot",listHtml:listHtml});
      history.push({role:"user",content:q});
      history.push({role:"assistant",content:"(returned a list of matching articles)"});
      saveTranscript();
    } else {
      ansEl.innerHTML = renderMD(raw);                     // drop the cursor
      if(raw){
        transcript.push({role:"user",content:q});
        transcript.push({role:"bot",answer:raw,sources:turnSources});
        history.push({role:"user",content:q}); history.push({role:"assistant",content:raw});
        saveTranscript(); addActions(bot, q, raw);
      }
    }
  }catch(err){
    if(isChart){ /* chart already rendered — leave it */ }
    else if(isList){ ansEl.innerHTML = listHtml; }
    else if(err.name!=="AbortError"){
      statusEl && statusEl.remove(); ansEl.style.display="block";
      ansEl.innerHTML = renderMD((raw?raw+"\n\n":"")+"⚠️ Connection lost: "+err.message);
    }else{
      ansEl.innerHTML = renderMD(raw || "_stopped_");
    }
  }finally{ setBusy(false); abortCtl=null; input.focus(); }
}

function stop(){ if(abortCtl) abortCtl.abort(); }
input.addEventListener("input", ()=> send.disabled = streaming?false:!input.value.trim());
send.disabled = true;
restore();        // replay any saved conversation from a previous visit
input.focus();
</script>
