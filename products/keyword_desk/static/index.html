<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyword Intel Desk</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#141922; --panel2:#1b2230; --line:#232c3b;
    --txt:#e6edf3; --dim:#8b98a9; --accent:#5eead4; --gold:#f5c451; --red:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{padding:22px 26px 14px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:19px;letter-spacing:.16em;font-weight:700;text-transform:uppercase}
  h1 .dot{color:var(--accent)}
  .sub{color:var(--dim);font-size:12px;margin-top:3px}
  .searchbar{display:flex;gap:10px;padding:18px 26px;position:sticky;top:0;
    background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
  #kw{flex:1;max-width:560px;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);padding:12px 14px;border-radius:9px;font-size:15px;outline:none}
  #kw:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#04211d;border:0;padding:0 20px;border-radius:9px;
    font-weight:700;cursor:pointer;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  .wrap{padding:20px 26px;max-width:1500px;margin:0 auto}
  .muted{color:var(--dim)}
  #status{padding:40px 26px;color:var(--dim);text-align:center;font-size:15px}
  .spinner{display:inline-block;width:15px;height:15px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;
    vertical-align:-3px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* insights */
  .section-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);margin:24px 0 12px;font-weight:700}
  .insights{background:linear-gradient(180deg,#17202b,#131922);border:1px solid var(--line);
    border-radius:14px;padding:18px 20px}
  .insights .gold-head{color:var(--gold);font-weight:700;letter-spacing:.1em;
    font-size:13px;text-transform:uppercase;margin-bottom:10px}
  .deduction{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .deduction:last-child{border-bottom:0}
  .chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;
    padding:4px 11px;font-size:12px;color:var(--dim)}
  .chip b{color:var(--txt)}
  .golds{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:16px}
  .goldcard{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);
    border-radius:10px;padding:13px 15px}
  .goldcard .lbl{color:var(--gold);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
  .goldcard .body{margin-top:7px;font-size:13px;color:var(--txt)}
  .goldcard .meta{margin-top:8px;color:var(--dim);font-size:12px}
  .excerpt{margin-top:8px;font-size:12.5px;color:#c3ccd8;max-height:150px;overflow:auto;
    background:var(--bg);border-radius:7px;padding:9px 11px;white-space:pre-wrap;line-height:1.55}

  /* analytical panels */
  .metrics{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
  .metric{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:8px 13px;min-width:96px}
  .metric .mv{font-size:18px;font-weight:700;color:var(--txt)}
  .metric .ml{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:2px}
  .trend{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase}
  .trend.rising{background:#0f2e1c;color:#5ee08a;border:1px solid #1c5c38}
  .trend.fading{background:#301616;color:#f0857e;border:1px solid #5c2320}
  .trend.steady{background:#20293a;color:#9fb2cc;border:1px solid #2c3852}
  .trend.insufficient{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
  .panelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px}
  .apanel{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .apanel h4{margin:0 0 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .voice{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
  .voice:last-child{border-bottom:0}
  .voice .vn{font-weight:600;color:var(--txt)}
  .voice .vp{color:var(--dim);font-size:11px}
  .voice .vv{color:var(--accent);font-size:11px}
  .voice .ve{margin-left:auto;color:var(--gold);font-weight:600;font-size:11.5px}
  .bar{margin:6px 0}
  .bar .bl{display:flex;justify-content:space-between;font-size:11.5px;color:#cdd6e0;margin-bottom:3px}
  .bar .bt{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
  .bar .bf{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
  .claim{padding:7px 0;font-size:12.5px;color:#dbe3ec;border-bottom:1px dashed var(--line)}
  .claim:last-child{border-bottom:0}
  .claim .cs{color:var(--dim);font-size:11px}
  .claim a{color:var(--accent);text-decoration:none}

  /* platform grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:8px}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column}
  .col h3{margin:0;padding:12px 15px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}
  .col h3 .pill{margin-left:auto;background:var(--panel2);color:var(--dim);font-size:11px;
    padding:2px 9px;border-radius:12px;letter-spacing:.05em}
  .col .note{padding:6px 15px;font-size:11px;color:var(--dim);background:var(--panel2)}
  .col .note.err{color:var(--red)}
  .posts{padding:6px 0;max-height:520px;overflow:auto}
  .post{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;gap:11px}
  .post:last-child{border-bottom:0}
  .post img{width:52px;height:52px;object-fit:cover;border-radius:7px;flex-shrink:0;background:var(--panel2)}
  .post .pauthor{font-weight:600;font-size:12.5px}
  .post .pauthor .v{color:var(--accent);font-size:11px}
  .post .ptext{font-size:12.5px;color:#cdd6e0;margin-top:2px}
  .post .pmeta{margin-top:5px;color:var(--dim);font-size:11px;display:flex;gap:10px;flex-wrap:wrap}
  .badge{color:var(--txt)}
  .empty{padding:20px 15px;color:var(--dim);font-size:12px;text-align:center}
</style>
</head>
<body>
  <header>
    <h1>Keyword Intel <span class="dot">Desk</span></h1>
    <div class="sub">One keyword → live scrape of 7 platforms → goldmine &amp; deductions. No stored data; every result fetched now.</div>
  </header>
  <div class="searchbar">
    <input id="kw" placeholder="Enter a keyword — e.g. PLA Navy, Rafale, Operation Sindoor…" autofocus>
    <button id="go">Search</button>
  </div>
  <div id="status" class="muted">Type a keyword and hit Search — the desk queries every platform live (~10–20s).</div>
  <div class="wrap" id="results" style="display:none">
    <div id="insights"></div>
    <div class="section-title">Per-platform results</div>
    <div class="grid" id="grid"></div>
  </div>

<script>
const PLAT = {
  reddit:{c:"#ff4500",i:"🟠",n:"Reddit"}, tiktok:{c:"#25f4ee",i:"🎵",n:"TikTok"},
  youtube:{c:"#ff4d4d",i:"▶️",n:"YouTube"}, twitter:{c:"#1d9bf0",i:"𝕏",n:"Twitter/X"},
  telegram:{c:"#229ed9",i:"✈️",n:"Telegram"}, instagram:{c:"#e1306c",i:"📷",n:"Instagram"},
  wechat:{c:"#07c160",i:"💬",n:"WeChat"}
};
const $=s=>document.querySelector(s);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>{n=+n||0;return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":""+n};
function ago(ts){if(!ts)return"";const d=(Date.now()-new Date(ts))/1e3;if(isNaN(d))return"";
  if(d<3600)return Math.round(d/60)+"m";if(d<86400)return Math.round(d/3600)+"h";return Math.round(d/86400)+"d"}

async function run(){
  const kw=$("#kw").value.trim(); if(!kw)return;
  $("#go").disabled=true; $("#results").style.display="none";
  $("#status").style.display="block";
  $("#status").innerHTML='<span class="spinner"></span>Scanning 7 platforms for “'+esc(kw)+'” …';
  try{
    const r=await fetch("/api/search?keyword="+encodeURIComponent(kw)+"&limit=8");
    const d=await r.json();
    if(d.error){$("#status").textContent="Error: "+d.error;return}
    render(d);
    $("#status").style.display="none"; $("#results").style.display="block";
  }catch(e){$("#status").textContent="Request failed: "+e}
  finally{$("#go").disabled=false}
}

function render(d){
  const ins=d.insights, g=ins.goldmine, s=ins.stats;
  let h='<div class="section-title">Goldmine &amp; Deductions · '+esc(d.keyword)+' · '+
    (d.took_ms/1000).toFixed(1)+'s</div><div class="insights"><div class="gold-head">◆ Deductions</div>';
  ins.deductions.forEach(x=>h+='<div class="deduction">'+esc(x)+'</div>');
  if(ins.themes&&ins.themes.length){h+='<div class="chips">';
    ins.themes.forEach(t=>h+='<span class="chip"><b>'+esc(t.term)+'</b> ·'+t.platforms+' platforms</span>');h+='</div>'}

  // ── metrics strip: velocity + reach + freshness ──
  const vel=ins.velocity||{}, tr=vel.trend||'insufficient';
  h+='<div class="metrics">';
  h+='<div class="metric"><div class="mv"><span class="trend '+tr+'">'+tr+'</span></div><div class="ml">Velocity 24h '+(vel.last_24h||0)+' vs '+(vel.prev_24h||0)+'</div></div>';
  h+='<div class="metric"><div class="mv">'+(s.fresh_48h||0)+'</div><div class="ml">Fresh · 48h</div></div>';
  h+='<div class="metric"><div class="mv">'+fmt(s.reach_views||0)+'</div><div class="ml">Views (sample)</div></div>';
  h+='<div class="metric"><div class="mv">'+fmt(s.reach_engagement||0)+'</div><div class="ml">Engagements</div></div>';
  if(ins.language_mix&&ins.language_mix.non_latin_pct)
    h+='<div class="metric"><div class="mv">'+ins.language_mix.non_latin_pct+'%</div><div class="ml">Non-Latin script</div></div>';
  h+='</div>';

  // ── analytical panels: voices · platform mix · claims · signals ──
  h+='<div class="panelgrid">';
  if(ins.voices&&ins.voices.length){h+='<div class="apanel"><h4>Loudest Voices</h4>';
    ins.voices.forEach(v=>h+='<div class="voice"><span class="vn">@'+esc(v.author)+'</span>'+
      (v.verified?'<span class="vv">✓</span>':'')+'<span class="vp">'+esc(v.platform)+' · '+v.posts+'p</span>'+
      '<span class="ve">'+fmt(v.engagement)+'</span></div>');h+='</div>'}
  if(ins.platform_breakdown&&ins.platform_breakdown.length){h+='<div class="apanel"><h4>Where The Signal Lives</h4>';
    const mx=Math.max(...ins.platform_breakdown.map(b=>b.engagement),1);
    ins.platform_breakdown.forEach(b=>h+='<div class="bar"><div class="bl"><span>'+esc(b.platform)+'</span>'+
      '<span class="muted">'+b.posts+'p · '+b.eng_share+'% eng</span></div>'+
      '<div class="bt"><div class="bf" style="width:'+Math.round(100*b.engagement/mx)+'%"></div></div></div>');h+='</div>'}
  if(ins.claims&&ins.claims.length){h+='<div class="apanel"><h4>Claims To Verify</h4>';
    ins.claims.forEach(c=>h+='<div class="claim">'+(c.url?'<a href="'+esc(c.url)+'" target="_blank">':'')+
      esc(c.claim)+(c.url?'</a>':'')+'<div class="cs">'+esc(c.platform)+(c.author?' · @'+esc(c.author):'')+'</div></div>');h+='</div>'}
  const sig=ins.signals||{};
  if((sig.hashtags&&sig.hashtags.length)||(sig.mentions&&sig.mentions.length)){
    h+='<div class="apanel"><h4>Entities In Play</h4><div class="chips">';
    (sig.hashtags||[]).forEach(t=>h+='<span class="chip"><b>#'+esc(t.tag)+'</b> ·'+t.n+'</span>');
    (sig.mentions||[]).forEach(m=>h+='<span class="chip">@'+esc(m.handle)+' ·'+m.n+'</span>');
    h+='</div>';
    if(ins.narrative&&ins.narrative.length)
      h+='<div style="margin-top:10px;font-size:12px;color:var(--dim)">Framing: '+ins.narrative.map(esc).join(' · ')+'</div>';
    h+='</div>'}
  h+='</div>';

  h+='<div class="golds">';
  if(g.top_post)h+=goldcard("Peak signal",g.top_post.platform+" · @"+esc(g.top_post.author||"?"),
    esc(g.top_post.text),(fmt(g.top_post.engagement)+" engagement"),g.top_post.url);
  if(g.most_viewed&&g.most_viewed.views)h+=goldcard("Most viewed",g.most_viewed.platform,
    esc(g.most_viewed.text),(fmt(g.most_viewed.views)+" views"),g.most_viewed.url);
  if(g.wechat_article)h+=goldcard("🇨🇳 WeChat full article (China source)",
    esc(g.wechat_article.account||"")+" · "+esc(g.wechat_article.title||""),
    "",ago(g.wechat_article.posted_at),g.wechat_article.url,esc(g.wechat_article.content));
  if(g.transcript)h+=goldcard("▶️ YouTube transcript (spoken content)",
    esc(g.transcript.title)+" · via "+g.transcript.provider,
    "",g.transcript.chars+" chars",g.transcript.url,esc(g.transcript.excerpt));
  h+='</div></div>';
  $("#insights").innerHTML=h;

  let gh="";
  for(const p of Object.keys(PLAT)){
    const pd=d.platforms[p]; if(!pd)continue; const cfg=PLAT[p];
    gh+='<div class="col"><h3 style="color:'+cfg.c+'">'+cfg.i+' '+cfg.n+
      '<span class="pill">'+(pd.count||0)+(pd.elapsed_s?" · "+pd.elapsed_s+"s":"")+'</span></h3>';
    if(pd.error)gh+='<div class="note err">'+esc(pd.error).slice(0,90)+'</div>';
    else if(pd.note)gh+='<div class="note">'+esc(pd.note).slice(0,110)+'</div>';
    gh+='<div class="posts">';
    if(!pd.posts||!pd.posts.length)gh+='<div class="empty">no matches</div>';
    else pd.posts.forEach(x=>gh+=postrow(x));
    gh+='</div></div>';
  }
  $("#grid").innerHTML=gh;
}

function goldcard(lbl,head,body,meta,url,excerpt){
  return '<div class="goldcard"><div class="lbl">'+lbl+'</div>'+
    '<div class="body"><b>'+head+'</b>'+(body?'<br>'+body:'')+'</div>'+
    (meta?'<div class="meta">'+meta+(url?' · <a href="'+url+'" target="_blank">open ↗</a>':'')+'</div>':
      (url?'<div class="meta"><a href="'+url+'" target="_blank">open ↗</a></div>':''))+
    (excerpt?'<div class="excerpt">'+excerpt+'</div>':'')+'</div>';
}

function postrow(x){
  const eng=[];
  if(x.upvotes)eng.push('▲'+fmt(x.upvotes));
  if(x.likes)eng.push('♥'+fmt(x.likes));
  if(x.comments)eng.push('💬'+fmt(x.comments));
  if(x.shares)eng.push('↻'+fmt(x.shares));
  if(x.views)eng.push('👁'+fmt(x.views));
  const a=ago(x.posted_at);
  const thumb=x.thumbnail?'<img src="'+esc(x.thumbnail)+'" loading="lazy" onerror="this.style.display=\'none\'">':'';
  return '<div class="post">'+thumb+'<div style="min-width:0">'+
    '<div class="pauthor">@'+esc(x.author||x.channel||"?")+(x.verified?' <span class="v">✔</span>':'')+
      (x.channel&&x.channel!==x.author?' <span class="muted">· '+esc(x.channel)+'</span>':'')+'</div>'+
    '<div class="ptext">'+esc((x.text||"").slice(0,220))+'</div>'+
    '<div class="pmeta">'+(a?'<span>'+a+' ago</span>':'')+
      eng.map(e=>'<span class="badge">'+e+'</span>').join('')+
      (x.url?'<a href="'+esc(x.url)+'" target="_blank">open ↗</a>':'')+'</div>'+
    '</div></div>';
}

$("#go").onclick=run;
$("#kw").addEventListener("keydown",e=>{if(e.key==="Enter")run()});
</script>
</body>
</html>
